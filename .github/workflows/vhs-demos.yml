name: VHS TUI Demos

on:
  push:
    branches: [main, master]
    paths: ['demos/*.tape', 'demos/*.vhs', '.github/workflows/vhs-demos.yml']
  workflow_dispatch:
permissions: read-all

jobs:
  render:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install VHS
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg ttyd
          curl -sLO "https://github.com/charmbracelet/vhs/releases/download/v0.11.0/vhs_0.11.0_Linux_x86_64.tar.gz"
          tar xzf vhs_0.11.0_Linux_x86_64.tar.gz --strip-components=1
          sudo mv vhs /usr/local/bin/
          vhs --version

      - name: Render demos
        run: |
          mkdir -p assets
          for tape in demos/*.tape demos/*.vhs; do
            [ -f "$tape" ] || continue
            name=$(basename "$tape" | sed 's/\.[^.]*$//')
            vhs "$tape" -o "assets/${name}-demo.gif"
            echo "Rendered: assets/${name}-demo.gif"
          done

      - name: Create PR with updated demos
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          commit-message: "chore: re-render VHS demos [skip ci]"
          title: "chore: re-render VHS demos"
          body: "Auto-generated VHS demo GIF updates."
          branch: "vhs-demo-update"
          delete-branch: true
          add-paths: assets/*.gif