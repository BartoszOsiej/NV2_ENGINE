name: VHS TUI Demos

on:
  push:
    branches: [main, master]
    paths: ['demos/*.tape', 'demos/*.vhs', '.github/workflows/vhs-demos.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install VHS
        run: |
          curl -sLO "https://github.com/charmbracelet/vhs/releases/download/v0.11.0/vhs_0.11.0_Linux_x86_64.tar.gz"
          tar xzf vhs_0.11.0_Linux_x86_64.tar.gz
          sudo mv vhs /usr/local/bin/
          vhs --version

      - name: Render demos
        run: |
          mkdir -p assets
          for tape in demos/*.tape demos/*.vhs; do
            [ -f "$tape" ] || continue
            name=$(basename "$tape" | sed 's/\.[^.]*$//')
            vhs "$tape" -o "assets/${name}.svg"
            echo "Rendered: assets/${name}.svg"
          done

      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg assets/*.gif
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: re-render VHS demos [skip ci]"
            git push
          fi
