# cargo-deny configuration — allow common OSS licenses
[advisories]
ignore = [
    "RUSTSEC-2026-0097",  # yanked core2 (transitive, can't upgrade)
    "RUSTSEC-2026-0204",  # crossbeam-epoch (transitive, no fix available)
    "RUSTSEC-2026-0258",  # h2 unbounded empty DATA frames (transitive)
    "RUSTSEC-2026-0194",  # quick-xml quadratic run time (transitive)
    "RUSTSEC-2026-0195",  # quick-xml unbounded namespace allocation (transitive)
    "RUSTSEC-2026-0196",  # cgmath unmaintained (transitive)
    "RUSTSEC-2026-0105",  # core2 unmaintained (transitive, yanked)
    "RUSTSEC-2024-0436",  # paste unmaintained (transitive)
]
unmaintained = "none"
yanked = "allow"
unused-ignored-advisory = "warn"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "CC0-1.0",
    "NCSA",
]

[bans]
multiple-versions = "warn"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
